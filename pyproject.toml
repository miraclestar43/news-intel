[project]
name = "news-intel"
version = "0.1.0"
description = "Low-noise personal news intelligence system"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "python-dateutil>=2.9",
    "icalendar>=5.0",
    "rapidfuzz>=3.9",
    "beautifulsoup4>=4.12",
    "python-telegram-bot>=22.0",
    "tenacity>=8.3",
    "structlog>=24.1",
    "typer>=0.12",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
pi-news = "news_intel.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
