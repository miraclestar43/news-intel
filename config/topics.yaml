# Gate A remediation Phase 3.3: bare "tariff" must not by itself route a
# story into the AI/semiconductor bucket (or any elevated relevance) --
# it requires contextual evidence of an actual trade-policy action, and
# administrative/utility tariff filings are excluded outright regardless
# of context.
trade_policy_context:
  anchor_terms_en: [tariff, tariffs]
  anchor_terms_zh: [关税]
  context_terms_en:
    - import
    - export
    - customs
    - duties
    - duty
    - section 301
    - section 232
    - trade war
    - retaliatory
    - sanction
  ai_semiconductor_context_terms_en:
    - semiconductor
    - semiconductors
    - chip
    - chips
    - AI
  negative_context_en:
    - electronic tariff filing
    - tariff filing
    - utility tariff
    - rate tariff
    - tariff schedule
    - FCC tariff
    - FERC tariff
    - retail tariff
    - insurance tariff
    - shipping tariff plan

# Gate A remediation Phase 4: none of these can be the *sole* shared
# anchor between two distinct events for them to count as one continuing
# multi-event trend -- otherwise nearly every AI story in a week would
# transitively chain into one meaningless mega-cluster.
trend_identity:
  generic_anchor_terms:
    - AI
    - Market
    - Markets
    - Government
    - Report
    - Research
    - United States
    - US
    - World
    - News
    - Company
    - Companies
    - Technology
    - Politics
    - Data
    # Retry 1 Blocker 2 (re-verification finding): an organization name
    # alone must not group unrelated product launches into one "trend" --
    # real production data showed "OpenAI" alone anchoring a 17-member
    # blob mixing office openings, model launches, and corporate
    # restructuring. A company name can still combine with a genuinely
    # shared specific product/version identifier (handled separately by
    # pipeline/product_identity.py); it just can no longer be the *sole*
    # basis for linking two distinct events.
    - OpenAI
    - ChatGPT
    - Anthropic
    - xAI
    - DeepMind
    - Google
    - Microsoft
    - Meta
    - NVIDIA
    - AMD
    - Broadcom
    - Qualcomm
    - ARM
    - Intel
    - TSMC
    - Samsung
    - SK Hynix
    - Micron
    - ASML
    # Retry 1 further re-verification: generic technology-platform terms
    # (as opposed to a specific product/release name) are equally
    # insufficient as a sole anchor. Real production data showed "GPU"
    # alone anchoring two completely unrelated posts (a distributed-SQL
    # workload post and an unrelated medical-physics simulation post), and
    # "NVIDIA CUDA"/"NVIDIA GPUs" (generic hardware/platform mentions, not
    # a specific product like "NVIDIA Nemotron" or "NVIDIA Alpamayo")
    # doing the same. "Federal Reserve Board" alone anchored 14 genuinely
    # distinct regulatory actions (bank approvals, unrelated enforcement
    # actions against different banks, rulemaking comment periods, the
    # annual stress test, FOMC projections) that share nothing but being
    # issued by the same body.
    - GPU
    - GPUs
    - CUDA
    - NVIDIA GPUs
    - NVIDIA CUDA
    - Federal Reserve Board
    - Federal Reserve
    - Reserve Board
    - API
    # Bare "GPT" (as opposed to a specific "GPT-5.6" version claim, which
    # is handled independently and does not rely on this list -- see
    # trends.py's _compatible) appears across dozens of otherwise-
    # unrelated OpenAI posts and is not by itself proof of a shared
    # development.
    - GPT
    # "System Card" is OpenAI's recurring document-type label for *any*
    # model (GPT-4o, GPT-5, GPT-5.2, ...) -- same pattern as "Investor
    # Alert" for law firms: a templated document type, not a shared
    # development.
    - System Card
  topic_trigram_floor: 0.12

# Gate A remediation Phase 3.4: repetitive law-firm shareholder-alert
# boilerplate ("if you purchased shares of X, contact our firm before the
# deadline") is noise -- it must not independently qualify for the digest,
# and different tickers/defendants sharing this template must never
# cluster as the same event. A separately-detected material corporate
# event (earnings restatement, SEC enforcement action, merger terms, etc.)
# still qualifies normally.
legal_notice_boilerplate:
  phrases:
    - shareholder rights firm
    - shareholder rights law firm
    - class action lawsuit
    - securities fraud class action
    - lead plaintiff deadline
    - encourages investors
    - purchased shares of
    - law firm investigates
    - law firm reminds investors
    - if you purchased or acquired shares
    - investor alert
    - shareholder alert
    - class action alert
  material_override_phrases:
    - sec charges
    - restated financial results
    - material weakness
    - merger agreement
    - acquisition completed
    - guilty plea
    - settlement of $
    - indicted
