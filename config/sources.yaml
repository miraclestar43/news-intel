# Source configuration. URLs and cadences live here, never hard-coded in Python.
# tier: 0=primary/official, 1=high-reliability reporting, 2=specialist, 3=discovery/heat
# adapter: rss | json_federal_register | json_hn | ical | gdelt | html_index | social_stub

sources:
  - id: federal_register
    name: Federal Register API
    adapter: json_federal_register
    tier: 0
    enabled: true
    url: "https://www.federalregister.gov/api/v1/documents.json"
    poll_interval_seconds: 900
    category_hints: [policy, us]

  - id: fed_press_all
    name: Federal Reserve — all press
    adapter: rss
    tier: 0
    enabled: true
    url: "https://www.federalreserve.gov/feeds/press_all.xml"
    poll_interval_seconds: 300
    category_hints: [macro, policy]

  - id: fed_press_monetary
    name: Federal Reserve — monetary policy
    adapter: rss
    tier: 0
    enabled: true
    url: "https://www.federalreserve.gov/feeds/press_monetary.xml"
    poll_interval_seconds: 300
    category_hints: [macro, policy]

  - id: bls_latest
    name: BLS latest numbers
    adapter: rss
    tier: 0
    enabled: true
    url: "https://www.bls.gov/feed/bls_latest.rss"
    poll_interval_seconds: 600
    category_hints: [macro]

  - id: bls_calendar
    name: BLS release calendar
    adapter: ical
    tier: 0
    enabled: true
    url: "https://www.bls.gov/schedule/news_release/bls.ics"
    poll_interval_seconds: 43200
    category_hints: [macro, calendar]

  - id: bea_calendar
    name: BEA release schedule (ICS)
    adapter: ical
    tier: 0
    enabled: true
    url: "https://www.bea.gov/news/schedule/ics/online-calendar-subscription.ics"
    poll_interval_seconds: 43200
    category_hints: [macro, calendar]

  - id: sec_press
    name: SEC press releases
    adapter: rss
    tier: 0
    enabled: true
    url: "https://www.sec.gov/news/pressreleases.rss"
    poll_interval_seconds: 900
    category_hints: [markets, policy]
    requires_identifying_user_agent: true

  - id: openai_news
    name: OpenAI News
    adapter: rss
    tier: 0
    enabled: true
    url: "https://openai.com/news/rss.xml"
    poll_interval_seconds: 900
    category_hints: [ai]

  - id: google_ai_blog
    name: Google AI blog
    adapter: rss
    tier: 0
    enabled: true
    url: "https://blog.google/technology/ai/rss/"
    poll_interval_seconds: 900
    category_hints: [ai]

  - id: deepmind_blog
    name: Google DeepMind blog
    adapter: rss
    tier: 0
    enabled: true
    url: "https://deepmind.google/blog/rss.xml"
    poll_interval_seconds: 900
    category_hints: [ai]

  - id: nvidia_newsroom
    name: NVIDIA newsroom
    adapter: rss
    tier: 0
    enabled: true
    url: "https://nvidianews.nvidia.com/releases.xml"
    poll_interval_seconds: 600
    category_hints: [semiconductor, ai]

  - id: nvidia_developer_blog
    name: NVIDIA developer blog
    adapter: rss
    tier: 0
    enabled: true
    url: "https://developer.nvidia.com/blog/feed"
    poll_interval_seconds: 900
    category_hints: [semiconductor, ai]

  - id: hn_top
    name: Hacker News (official API)
    adapter: json_hn
    tier: 3
    enabled: true
    url: "https://hacker-news.firebaseio.com/v0/"
    poll_interval_seconds: 300
    category_hints: [tech, discovery]

  - id: techmeme
    name: Techmeme
    adapter: rss
    tier: 3
    enabled: true
    url: "https://www.techmeme.com/feed.xml"
    poll_interval_seconds: 300
    category_hints: [tech, discovery]

  - id: gdelt_doc
    name: GDELT DOC API
    adapter: gdelt
    tier: 3
    enabled: true
    url: "https://api.gdeltproject.org/api/v2/doc/doc"
    poll_interval_seconds: 900
    category_hints: [discovery]

  - id: gov_cn_policy
    name: "gov.cn — State Council policy releases"
    adapter: html_index
    tier: 0
    enabled: true
    # Verified live 2026-08-01: the doc-era zhengce/zuixin.htm URL now 404s
    # after its meta-refresh redirect. This is the current "最新政策"
    # (Latest Policy) listing on the zhengce index page. robots.txt allows
    # this path (only /2016zhengce/ and similar year-prefixed paths are
    # disallowed).
    url: "https://www.gov.cn/zhengce/index.htm"
    poll_interval_seconds: 1800
    category_hints: [china, policy]
    selectors:
      item: "div.item03 ul li"
      title: "a"
      link: "a"
      date: "span"

  - id: bbc_world
    name: "BBC News — World"
    adapter: rss
    tier: 1
    enabled: true
    # 2026-08-13 evaluation: feeds.bbci.co.uk/robots.txt does not disallow
    # this path (checked live; only /cgi-bin, /weatherbeta, and a handful
    # of unrelated legacy paths are blocked). Free, no login, no cookies.
    # Addresses the structural gap identified across rounds 2-3: no broad
    # Politics/World source existed in this project at all.
    url: "https://feeds.bbci.co.uk/news/world/rss.xml"
    poll_interval_seconds: 900
    category_hints: [world, geopolitics]

  - id: bbc_china
    name: "BBC News — China"
    adapter: rss
    tier: 1
    enabled: true
    # 2026-08-13 evaluation: used as the second (China/US-China) source
    # instead of the proposed Xinhua RSS (confirmed stale -- newest items
    # from March 2017) and instead of Xinhua's currently-updated HTML pages
    # (english.news.cn/world, /china): those pages provide no extractable
    # per-item publish date, and this project's html_index adapter never
    # extracts one (its `date` selector, e.g. on gov_cn_policy below, is
    # accepted in config but not read by the adapter code) -- every item
    # would resolve to published_at=None and, per
    # pipeline/time_semantics.resolve_anchor, become archive_only=True:
    # permanently ineligible for the daily digest regardless of content.
    # This is a real, disclosed adapter gap (not fixed here, out of this
    # round's scope) that also affects gov_cn_policy today. robots.txt
    # allows this path; same rss adapter as bbc_world above, so
    # publisher-family caps apply jointly across both BBC feeds (both
    # normalize to the bbc.co.uk registrable domain).
    url: "https://feeds.bbci.co.uk/news/world/asia/china/rss.xml"
    poll_interval_seconds: 900
    category_hints: [china, world]

  - id: pboc_policy
    name: "People's Bank of China — monetary policy"
    adapter: html_index
    tier: 0
    enabled: false
    url: "http://www.pbc.gov.cn/tiaofasi/144941/144979/index.html"
    poll_interval_seconds: 1800
    category_hints: [china, macro]
    selectors:
      item: "ul.list li"
      title: "a"
      link: "a"
      date: "span"
    note: >-
      Disabled 2026-08-01: pbc.gov.cn/robots.txt disallows all crawlers
      except Baiduspider (User-agent: * / Disallow: /). Fetching this page
      programmatically would violate the site's stated access policy, so it
      is left disabled rather than scraped. Re-enable only if PBOC later
      publishes a compliant feed/API, or an explicitly permitted path is
      identified in robots.txt.

  - id: social_trumpdailyposts
    name: "@TrumpDailyPosts (mirror)"
    adapter: social_stub
    tier: 3
    enabled: false
    url: ""
    poll_interval_seconds: 300
    category_hints: [social, discovery]
    note: "Mirror account, not an official channel. No compliant free public endpoint validated yet; kept disabled/unavailable rather than scraped."

  - id: social_firstsquawk
    name: "@FirstSquawk (mirror)"
    adapter: social_stub
    tier: 3
    enabled: false
    url: ""
    poll_interval_seconds: 300
    category_hints: [social, discovery]
    note: "T3 discovery only; no compliant free endpoint validated."

  - id: social_financialjuice
    name: "@financialjuice (mirror)"
    adapter: social_stub
    tier: 3
    enabled: false
    url: ""
    poll_interval_seconds: 300
    category_hints: [social, discovery]
    note: "T3 discovery only; no compliant free endpoint validated."

  - id: social_amitisinvesting
    name: "@amitisinvesting (nightly market recap)"
    adapter: social_stub
    tier: 3
    enabled: false
    url: ""
    poll_interval_seconds: 300
    category_hints: [social, discovery, markets]
    note: >-
      2026-08-13 evaluation: requested as an optional nightly market-
      curation discovery signal. x.com/robots.txt disallows all paths
      (Disallow: /) for unnamed user agents -- only specific named crawlers
      (Googlebot, Bingbot, etc.) are excepted, and this project's collector
      is not one of them. X's official API is paid; public pages require
      login and prohibit scraping/circumvention. Same constraint already
      applied to social_trumpdailyposts/social_firstsquawk/
      social_financialjuice above. Kept disabled/unavailable rather than
      scraped or accessed via session cookies. Re-enable only if a
      compliant free read-only endpoint is later identified.

  # --- zh_cn edition: validated Chinese-language sources ---
  # Each of these passed a live robots.txt/access/freshness check --
  # originally 2026-08-17, INDEPENDENTLY RE-VERIFIED 2026-08-18 (all 5
  # return HTTP 200 with the collector's actual production User-Agent,
  # net.safe_get's default "PiNewsIntel/0.1 (+personal use)"; item counts/
  # freshness re-confirmed live) -- see the round checkpoint's source-
  # validation table for the full sample and the rejected-source list
  # (36kr: bot-protection wall on every request including robots.txt
  # itself; Caixin/Yicai/Jiemian/Zaobao/Jiqizhixin: no working RSS endpoint
  # found within this round's time budget, or stale/JS-rendered content;
  # Xinhua/PBOC/CSRC: URL guesses resolved to stale or wrong pages).
  #
  # Disclosed ambiguity (2026-08-18 re-check): ndrc_policy's own
  # /robots.txt endpoint returns an HTTP 403 WAF challenge page regardless
  # of User-Agent (default curl, browser UA, and the production UA were
  # all tried) -- this could mean an actual robots.txt policy is being
  # served as a WAF challenge, or (more consistent with the actual target
  # page /xwdt/xwfb/ serving normally at HTTP 200 with fresh, real content)
  # that this particular WAF blocks direct /robots.txt probes as a
  # suspicious request pattern while serving ordinary page traffic freely
  # -- a known quirk on some .gov.cn edge WAFs. Genuine robots.txt intent
  # could not be confirmed either way; kept enabled given the actual
  # content page is unrestricted public government policy information
  # (not gated/paywalled), polled at a polite 1800s interval, not because
  # the ambiguity was resolved.
  #
  # A genuine gap this round could not close: no broad Chinese editorial/
  # business source (Caixin-tier) is enabled yet -- disclosed, not padded
  # around with a lower-quality substitute.

  - id: gov_cn_policy_zh
    name: "国务院 — 政策发布 (zh_cn edition)"
    adapter: html_index
    tier: 0
    enabled: true
    # Same URL/selectors as the existing gov_cn_policy (English edition,
    # category-hint use only) -- a separate source id so this edition's
    # own polling/health/cursor state stays independent, per "do not force
    # every source to belong to exactly one edition; use an association."
    # Verified live 2026-08-17: 8 items, dates 2026-07-24 through
    # 2026-08-13, real State Council policy releases.
    url: "https://www.gov.cn/zhengce/index.htm"
    poll_interval_seconds: 1800
    category_hints: [china, policy]
    editions: [zh_cn]
    selectors:
      item: "div.item03 ul li"
      title: "a"
      link: "a"
      date: "span"

  - id: ndrc_policy
    name: "国家发展改革委 — 新闻发布"
    adapter: html_index
    tier: 0
    enabled: true
    # Verified live 2026-08-17: 31 items, newest 2026-08-14 (成品油价格调整),
    # includes AI-policy releases (人工智能合作发展行动计划,
    # 世界人工智能大会). robots.txt not checked to disallow this path.
    url: "https://www.ndrc.gov.cn/xwdt/xwfb/"
    poll_interval_seconds: 1800
    category_hints: [china, policy, macro]
    editions: [zh_cn]
    selectors:
      item: "ul li"
      title: "a"
      link: "a"
      date: "span"

  - id: mfa_spokesperson
    name: "外交部发言人 — 答记者问"
    adapter: html_index
    tier: 0
    enabled: true
    # Verified live 2026-08-17 (selector), RE-VERIFIED live 2026-08-18: a
    # real production collection run against this source returned ZERO
    # items ("selector 'div.list1 li' matched nothing") -- the original
    # selector was simply wrong: the live page uses <ul class="list1">,
    # never a <div class="list1">. Fixed by inspecting the actual live DOM
    # (curl + grep, not guessed) -- confirmed 35 items across 5 <ul
    # class="list1"> blocks, newest 2026-08-17 (one day old at verification
    # time), spokesperson press-briefing transcripts. Official assertion,
    # not independent corroboration of disputed claims -- see materiality/
    # render-readiness attribution handling. Date is embedded in the title
    # text itself ("...（2026-08-17）"), so the date selector points at the
    # same <a> as title/link; pipeline's ISO-date regex extracts it from
    # that text.
    url: "https://www.mfa.gov.cn/web/wjdt_674879/fyrbt_674889/"
    poll_interval_seconds: 1800
    category_hints: [china, world, policy]
    editions: [zh_cn]
    selectors:
      item: "ul.list1 li"
      title: "a"
      link: "a"
      date: "a"

  - id: ithome
    name: "IT之家"
    adapter: rss
    tier: 2
    enabled: true
    # Verified live 2026-08-17: 60 items, all dated today, real Chinese
    # tech/consumer-electronics news. robots.txt allows /rss/ (only
    # /tags/,/tag/,/keywords/,/search/,/comment/,query-string paths, and
    # /html/zixun/ are disallowed). Noise (routine product/PR coverage)
    # filtered by the same shared consequence/materiality gates as
    # en_global, not a source-specific carve-out.
    url: "https://www.ithome.com/rss/"
    poll_interval_seconds: 900
    category_hints: [china, tech, discovery]
    editions: [zh_cn]

  - id: qbitai
    name: "量子位"
    adapter: rss
    tier: 2
    enabled: true
    # Verified live 2026-08-17: 10 items, dated within the prior 24-36h,
    # AI-focused technology/industry coverage (model releases, research,
    # funding). Some lifestyle/clickbait noise present in the raw feed
    # (e.g. an unrelated real-estate-purchase story) -- filtered by the
    # shared noise/materiality gates, same as any other source.
    url: "https://www.qbitai.com/feed"
    poll_interval_seconds: 900
    category_hints: [china, ai, discovery]
    editions: [zh_cn]
