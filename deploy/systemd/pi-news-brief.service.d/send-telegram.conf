# Install ONLY when the Telegram send is enabled (deployment step G); without this drop-in the build never sends.
#
# The send follows the build instead of a clock (2026-11-02): the 20:50 Beijing last attempt can run until about
# 21:20, so a fixed 21:00 send could miss the whole edition. Every successful build run -- built, completed, reused
# (0) or built_degraded (3) -- starts the send; the send is idempotent per edition (brief:zh_cn:<date>:<chat>, pre-
# marked, never retried), so the 20:50 run after a 20:05 success does not send twice, and it refuses to send after
# cutoff + 3 h (23:00 Beijing). retry_later (75) and failed (1) start nothing.
[Unit]
OnSuccess=pi-news-brief-telegram.service

[Service]
SuccessExitStatus=3
